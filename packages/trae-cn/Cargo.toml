[package]
name = "nora-provider-trae-cn"
version = "1.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[dependencies]
nora-provider-network.workspace = true
nora-provider = { path = "../runtime" }
nora-provider-plugin-sdk.workspace = true
nora-ai.workspace = true
async-trait = "0.1.89"
aes = "0.8.4"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
chrono = "0.4.44"
futures = "0.3.32"
libc = "0.2.183"
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.8.6"
regex = "1.13.1"
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "net", "fs", "io-util"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
