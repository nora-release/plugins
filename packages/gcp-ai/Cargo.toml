[package]
name = "nora-provider-gcp-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nora-provider-network.workspace = true
nora-provider = { path = "../runtime" }
nora-provider-plugin-sdk.workspace = true
nora-ai.workspace = true
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "sync", "net"] }
url = "2"
chrono = "0.4"
sha2 = "0.10"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
futures = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
