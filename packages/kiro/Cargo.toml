[package]
name = "nora-provider-kiro"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nora-ai.workspace = true
nora-provider-plugin-sdk.workspace = true
nora-provider = { path = "../runtime" }
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
crc32fast = "1"
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
url = "2"
