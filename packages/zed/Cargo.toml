[package]
name = "nora-provider-zed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nora-network.workspace = true
nora-ai.workspace = true
nora-provider-plugin-sdk.workspace = true
nora-provider = { path = "../runtime" }
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
futures = "0.3"
rand = "0.8"
rsa = "0.9"
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
url = "2"
