name: Check gateway provider plugins

on:
  pull_request:
    paths: ['packages/gateway-providers/**', 'Makefile', '.github/workflows/check-gateway-providers.yml']
  push:
    branches: [main]
    paths: ['packages/gateway-providers/**', 'Makefile', '.github/workflows/check-gateway-providers.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Formatting, lints and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check toolchain
        run: rustup update stable --no-self-update && rustup component add rustfmt clippy
      - name: Check
        run: make check
