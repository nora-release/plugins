resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
nora-provider-network = { path = "packages/network", features = ["ipv4-fallback"] }
nora-ai = { git = "https://github.com/nora-release/nora.git", rev = "8bfa6e374208b38687ba6ce14c9e6b73a3aee0a7" }
nora-provider-plugin-sdk = { git = "https://github.com/nora-release/nora.git", rev = "8bfa6e374208b38687ba6ce14c9e6b73a3aee0a7" }

[patch.crates-io]
reqwest = { path = "packages/network/vendor/reqwest" }
