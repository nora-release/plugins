[package]
name = "nora-provider-zai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nora-provider = { path = "../runtime" }
nora-provider-quota = { path = "../quota" }
nora-ai.workspace = true
nora-provider-plugin-sdk.workspace = true
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["test-util"] }
