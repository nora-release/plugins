[package]
name = "nora-provider-cursor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nora-network = { workspace = true, features = ["http2"] }
nora-ai.workspace = true
nora-provider-plugin-sdk.workspace = true
nora-provider = { path = "../runtime" }
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
flate2 = "1"
futures = "0.3"
h2 = "0.4"
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "socks"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process"] }
url = "2"

[dev-dependencies]
bytes = "1"
http = "1"
tokio = { version = "1", features = ["net", "io-util", "test-util"] }
