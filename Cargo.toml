[workspace]
members = [
    "packages/auth",
    "packages/runtime",
    "packages/openai",
    "packages/xai",
    "packages/anthropic",
    "packages/github-copilot",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
nora-ai = { git = "https://github.com/nora-release/nora.git", rev = "d96eb5ea5a5a0c47ea0765ce610c64a417ac4412" }
nora-provider-plugin-sdk = { git = "https://github.com/nora-release/nora.git", rev = "d96eb5ea5a5a0c47ea0765ce610c64a417ac4412" }
