[package]
name = "nora-provider-redact"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.2"
hmac = "0.12"
libc = "0.2"
nora-provider-plugin-sdk.workspace = true
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros"] }

[[test]]
name = "official"
path = "test/official.test.rs"

[[test]]
name = "behavior"
path = "test/behavior.test.rs"

[[test]]
name="protocol"
path="test/protocol.test.rs"
