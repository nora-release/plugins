[workspace]
members = [
    "packages/typesafe",
    "packages/google-gemini",
    "packages/kiro",
    "packages/codeassist",
    "packages/gemini-cli",
    "packages/antigravity",
    "packages/kimi-work",
    "packages/ollama-cloud",
    "packages/minimax-cn",
    "packages/minimax",
    "packages/opencode-go",
    "packages/kimi-coding",
    "packages/zai",
    "packages/zhipu",
    "packages/aihubmix",
    "packages/stepfun-cn",
    "packages/stepfun",
    "packages/siliconflow-global",
    "packages/siliconflow",
    "packages/openrouter",
    "packages/moonshotai-cn",
    "packages/moonshotai",
    "packages/deepseek",
    "packages/quota",
    "packages/auth",
    "packages/runtime",
    "packages/openai",
    "packages/xai",
    "packages/anthropic",
    "packages/github-copilot",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
nora-ai = { git = "https://github.com/nora-release/nora.git", rev = "709c2225bd5c9003655a806f1d598a7c7269e822" }
nora-provider-plugin-sdk = { git = "https://github.com/nora-release/nora.git", rev = "709c2225bd5c9003655a806f1d598a7c7269e822" }
