[package]
name = "nora-provider-factory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nora-ai.workspace = true
nora-provider-plugin-sdk.workspace = true
nora-provider = { path = "../runtime" }
nora-provider-subscription-core = { path = "../subscription-core" }
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
futures = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
