[package]
name = "nora-provider-google-vertex"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nora-provider-network.workspace = true
nora-ai.workspace = true
nora-provider-plugin-sdk.workspace = true
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
futures = "0.3"
jsonwebtoken = "9"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
url = "2"

[dev-dependencies]
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
