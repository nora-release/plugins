name: Release provider

# Bump packages/<id>/nora-plugin.json on main, then push <id>-vX.Y.Z.
# NORA_SOURCE_TOKEN needs Contents: read on the private nora-release/nora repo.
on:
  push:
    tags: ['*-v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example openai-v1.2.1'
        required: true
        type: string
      dry_run:
        description: 'Build and validate without publishing or changing the catalog'
        type: boolean
        default: true

permissions:
  contents: read

# Different plugins may publish concurrently; catalog writes retry on SHA conflicts.
concurrency:
  group: provider-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RUST_TEST_THREADS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    name: Check and package
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      id: ${{ steps.release.outputs.id }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      tools_commit: ${{ steps.release.outputs.tools_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and version
        id: release
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo 'Release tags must point to a commit already merged into main.' >&2
            exit 1
          fi
          source_root="${RUNNER_TEMP}/provider-release-source"
          git worktree add --detach "$source_root" "$tag_commit"
          python3 scripts/provider_release.py validate \
            --tag "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --root "$source_root" --catalog providers.json --github-output "$GITHUB_OUTPUT"
          if [[ "$(rustc -vV | sed -n 's/^host: //p')" != 'aarch64-apple-darwin' ]]; then
            echo 'Provider releases require the macOS Apple Silicon runner.' >&2
            exit 1
          fi
          {
            echo "commit=$tag_commit"
            echo "tools_commit=$(git rev-parse HEAD)"
            echo "source_root=$source_root"
          } >> "$GITHUB_OUTPUT"
      - name: Check toolchain
        run: rustup update stable --no-self-update && rustup component add rustfmt
      - name: Check release scripts
        run: make test-scripts
      - name: Test selected provider
        uses: ./.github/actions/cargo-auth
        env:
          PROVIDER_ID: ${{ steps.release.outputs.id }}
          NORA_PROVIDER_SOURCE_ROOT: ${{ steps.release.outputs.source_root }}
        with:
          token: ${{ secrets.NORA_SOURCE_TOKEN }}
          command: make fmt-check test
      - name: Build selected provider package
        uses: ./.github/actions/cargo-auth
        env:
          PROVIDER_ID: ${{ steps.release.outputs.id }}
          NORA_PROVIDER_SOURCE_ROOT: ${{ steps.release.outputs.source_root }}
          PROVIDER_DOWNLOAD_BASE_URL: ${{ steps.release.outputs.release_base }}
        with:
          token: ${{ secrets.NORA_SOURCE_TOKEN }}
          command: make package
      - name: Prepare selected plugin
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          NORA_PROVIDER_SOURCE_ROOT: ${{ steps.release.outputs.source_root }}
        run: |
          python3 scripts/provider_release.py prepare \
            --tag "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --root "$NORA_PROVIDER_SOURCE_ROOT" --current-catalog providers.json \
            --packages-dir .build/packages --output .build/release
      - name: Save validated release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-${{ steps.release.outputs.id }}-${{ steps.release.outputs.version }}
          path: .build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish and update catalog
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.tools_commit }}
          persist-credentials: false
      - name: Download validated release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provider-${{ needs.build.outputs.id }}-${{ needs.build.outputs.version }}
          path: .build/release
      - name: Publish verified assets before updating the catalog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          arguments=(
            --tag "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY"
            --release-dir .build/release --target "$RELEASE_COMMIT"
          )
          if [[ "$RELEASE_DRY_RUN" == 'true' ]]; then
            arguments+=(--dry-run)
          fi
          python3 scripts/provider_release.py publish "${arguments[@]}"
