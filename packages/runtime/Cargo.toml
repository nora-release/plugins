[package]
name = "nora-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nora-provider-network.workspace = true
nora-provider-plugin-sdk.workspace = true
nora-ai.workspace = true
nora-provider-auth = { path = "../auth" }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = "0.4"
futures = "0.3"
globset = "0.4"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
multer = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[dev-dependencies]
time = "0.3"
fs2 = "0.4"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["net"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.14"
