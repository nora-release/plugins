[package]
name = "nora-provider-cline"
version = "1.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[dependencies]
nora-provider-subscription-core = { path = "../subscription-core" }
nora-provider-plugin-sdk.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }
nora-ai.workspace = true
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
