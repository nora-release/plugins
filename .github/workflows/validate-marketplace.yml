name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: validator
          persist-credentials: false
      - name: Checkout proposed catalog
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: registry
          persist-credentials: false
      - name: Validate catalog and release archives without running plugins
        run: |
          make -C "$GITHUB_WORKSPACE/validator" marketplace-check \
            REGISTRY="$GITHUB_WORKSPACE/registry/registry.json" \
            CATALOG="$GITHUB_WORKSPACE/registry/marketplace.json"
