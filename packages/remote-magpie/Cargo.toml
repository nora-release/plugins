[package]
name = "nora-provider-remote-magpie"
version = "1.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[dependencies]
nora-provider-network.workspace = true
nora-ai.workspace = true
nora-provider-plugin-sdk.workspace = true
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.44"
futures = "0.3.32"
libc = "0.2.177"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "net", "io-util", "fs"] }
url = "2.5.8"
