[workspace]
# their own workspace, on the protocol nora-gateway speaks
exclude = ["packages/gateway-providers"]
members = [
    "packages/middleware/redact",
    "packages/crates/middleware-runtime",
    "packages/middleware/antigravity-cloak",
    "packages/middleware/block-patterns",
    "packages/middleware/codex-history",
    "packages/middleware/model-map",
    "packages/middleware/param-override",
    "packages/middleware/reserve",
    "packages/middleware/system-prompt",
    "packages/middleware/think-tags",
    "packages/middleware/word-guard",

    "packages/providers/cloudflare-workers-ai",
    "packages/providers/chatgpt-api",
    "packages/providers/nous-portal",
    "packages/crates/search-api",
    "packages/providers/tavily",
    "packages/providers/brave-search",
    "packages/providers/exa-search",
    "packages/providers/firecrawl",
    "packages/providers/you-search",
    "packages/providers/deepseek-search",
    "packages/providers/searxng",

    "packages/providers/autoclaw",
    "packages/providers/autoclaw-cn",
    "packages/providers/remote-magpie",
    "packages/providers/clinepass",
    "packages/providers/vercel-jev",
    "packages/providers/cloudflare-jev",
    "packages/providers/bailian-decision",
    "packages/providers/qwen-decision",
    "packages/providers/devin",
    "packages/providers/mimo-app",
    "packages/providers/kimi-code",
    "packages/providers/trae-cn",
    "packages/providers/trae-global",
    "packages/providers/tencent-cloud",
    "packages/providers/volcengine",
    "packages/providers/zcode",

    "packages/providers/factory",
    "packages/providers/opencode-zen-free",
    "packages/providers/amazon-bedrock",
    "packages/providers/amazon-bedrock-mantle",
    "packages/providers/qoder",
    "packages/providers/qwenwork",
    "packages/providers/qwenwork-enterprise",
    "packages/providers/gcp-ai",
    "packages/providers/joycode",
    "packages/providers/qoder-cn",
    "packages/providers/commandcode-plan",
    "packages/providers/zed",
    "packages/providers/codearts",
    "packages/providers/raccoon",
    "packages/providers/cursor",
    "packages/providers/cline",
    "packages/providers/google-vertex",
    "packages/providers/workbuddy",
    "packages/providers/workbuddy-ai",
    "packages/providers/minimax-code",
    "packages/providers/minimax-code-global",
    "packages/providers/opendesign",
    "packages/crates/subscription-core",
    "packages/providers/typesafe",
    "packages/providers/google-gemini",
    "packages/providers/kiro",
    "packages/crates/codeassist",
    "packages/providers/gemini-cli",
    "packages/providers/antigravity",
    "packages/providers/kimi-work",
    "packages/providers/ollama-cloud",
    "packages/providers/minimax-cn",
    "packages/providers/minimax",
    "packages/providers/opencode-go",
    "packages/providers/kimi-coding",
    "packages/providers/zai",
    "packages/providers/zhipu",
    "packages/providers/aihubmix",
    "packages/providers/stepfun-cn",
    "packages/providers/stepfun",
    "packages/providers/siliconflow-global",
    "packages/providers/siliconflow",
    "packages/providers/openrouter",
    "packages/providers/moonshotai-cn",
    "packages/providers/moonshotai",
    "packages/providers/deepseek",
    "packages/crates/quota",
    "packages/crates/auth",
    "packages/crates/runtime",
    "packages/providers/openai",
    "packages/providers/xai",
    "packages/providers/anthropic",
    "packages/providers/github-copilot",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
nora-network = { git = "https://github.com/nora-release/plugin-kit", rev = "def945a909fd7c89e452d1a415ada353ee252779", features = ["ipv4-fallback"] }
nora-plugin-manifest = { git = "https://github.com/nora-release/plugin-kit", rev = "e7d93704b5a0b2549f6152d153f4da962b761356" }
nora-ai = { git = "https://github.com/nora-release/nora.git", rev = "d8e98dde126803eddae3560152847f23c4977694" }
nora-provider-plugin-sdk = { git = "https://github.com/nora-release/plugin-kit", rev = "def945a909fd7c89e452d1a415ada353ee252779", features = ["ipv4-fallback"] }

[patch.crates-io]
reqwest = { git = "https://github.com/nora-release/plugin-kit", rev = "def945a909fd7c89e452d1a415ada353ee252779" }
