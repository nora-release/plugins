# Provider plugins for nora-gateway: a workspace of their own, on the
# plugin-kit revision their protocol comes from, apart from the packages
# Nora Router still uses.
[workspace]
resolver = "2"
members = ["chatgpt", "copilot", "grok", "kiro", "support", "workbuddy"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
nora-gateway-provider-support = { path = "support" }
nora-plugin-runtime-sdk = { git = "https://github.com/nora-release/plugin-kit", rev = "20a4d16ccc505ce740298790eee546ff5d6d1c54" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
futures = "0.3"
getrandom = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util", "io-std", "net"] }
url = "2"

[workspace.lints.clippy]
