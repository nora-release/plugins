[package]
name = "nora-provider-codearts"
version = "1.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[dependencies]
nora-network.workspace = true
nora-provider-plugin-sdk.workspace = true
nora-ai.workspace = true
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.44"
futures = "0.3.32"
getrandom = "0.2.17"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "io-util", "net"] }
url = "2.5.8"
